version: "3.8"

services:
  # ==========================================================================
  # 基础设施
  # ==========================================================================

  redis:
    image: redis:latest
    container_name: nc_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "36379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16
    container_name: gof_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: quant
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # Worker —— 单容器多进程
  # ==========================================================================

  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quant_workers
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/quant
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
    command: python scripts/run_workers.py

volumes:
  redis_data:
  pg_data:
