version: "3.8"

services:
  # ==========================================================================
  # 基础设施
  # ==========================================================================

  redis:
    image: redis:7-alpine
    container_name: quant_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: quant_postgres
    restart: always
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
      POSTGRES_DB: quant
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # Worker —— 单容器多进程，所有 worker 通过 multiprocessing 管理
  # 新增 worker 只需在 run_workers.py 的 WORKERS 字典注册即可
  # ==========================================================================

  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quant_workers
    restart: always
    environment:
      DATABASE_URL: postgresql://quant:${PG_PASSWORD:-changeme}@postgres:5432/quant
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ../config:/app/config:ro
      - ../logs:/app/logs
    # 不加 --worker 参数 → 启动 WORKERS 字典中所有 worker
    command: python scripts/run_workers.py

volumes:
  redis_data:
  pg_data:
